# BSD-3-Clause
#
# Pull-request and `dev` push gate. One required check: `ci-pass`.
#
# The workspace builds in seconds, so the Rust jobs are not path-scoped.
# The C rebuild is. A workflow-level `paths:` filter would suppress the
# run, and a required check that never reports waits forever. `c-vectors`
# is a job-level condition. `ci-pass` treats its skip as a pass only when
# `c_vectors_scope.py` said the range does not touch the inputs.
#
# `fp2` 0.6.0 takes `core::arch` on x86_64 and the portable path elsewhere.
# `test-aarch64` is that path. Byte order is the nightly s390x run.
#
# Actions are pinned to commit SHAs. Checkout does not fetch the submodule
# except in the two C jobs.

name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      c_vectors: ${{ steps.scope.outputs.c_vectors }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/c_vectors_scope.py --base "$BASE" --head "$HEAD"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - name: Check the certificate verifier against known and invalid proofs
        run: python3 scripts/ci/test_signer_prime_certificates.py
      - name: Verify pinned signer primality certificates
        run: python3 scripts/ci/check_signer_prime_certificates.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      # One release everywhere: rust-toolchain.toml, the workspace's
      # rust-version, and every `toolchain:` line of every workflow. The
      # floor is the pin because older compilers have the fault of ledger
      # O31, so a workflow on another release would test a different thing.
      - name: Every workflow, rust-toolchain.toml and rust-version name one release
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          floor=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$floor" != "$channel" ]; then
            echo "rust-toolchain.toml pins ${channel}; the workspace's rust-version is ${floor}"
            exit 1
          fi
          lines=$(grep -h '^ *toolchain: ' .github/workflows/*.yml | sed 's/^ *toolchain: //')
          count=$(printf '%s\n' "$lines" | wc -l)
          other=$(printf '%s\n' "$lines" | grep -vxF "$channel" || true)
          if [ -n "$other" ]; then
            echo "rust-toolchain.toml pins ${channel}; a workflow pins: ${other}"
            exit 1
          fi
          echo "${count} workflow pins, rust-toolchain.toml and rust-version are ${channel}"
      - name: Format
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check
      # The boundary check compiles an isolated consumer with --offline, so
      # the locked dependencies must be in the registry before it runs.
      - name: Fetch the locked dependencies
        run: cargo fetch --locked
      - name: Reduced-width API is absent from default production builds
        run: python3 scripts/ci/check_research_boundary.py
      # The counter and the stage names are measuring equipment. No manifest
      # turns the feature on, no default graph has it, and a consumer of a
      # default build cannot name `prism_field::ops` or
      # `prism_verify::stage`: the check compiles one that tries. The
      # self-test plants each breach of the manifest rules.
      - name: The operation counter and its API are in no default build
        run: |
          set -euo pipefail
          python3 scripts/ci/check_op_count_isolation.py --selftest
          python3 scripts/ci/check_op_count_isolation.py
      # The crate that holds the committed test data is in no build of the
      # three layer crates or of the front crate, and has none of the
      # verifier, the isogeny crate and the front crate in its own graph,
      # dev edges included. The self-test plants
      # each breach in a copy of the manifests first, so a check that had
      # gone blind fails here instead of passing.
      - name: No library build holds test data, and the vectors crate does not depend on what it tests
        run: |
          python3 scripts/ci/check_vectors_isolation.py --selftest
          python3 scripts/ci/check_vectors_isolation.py
      # A crate's tests may not depend on a crate above it: no manifest of
      # the library or of the testkit names a crate later in the order
      # field, vectors, isogeny, verify, testkit, front, in any table, dev
      # tables included. The self-test plants each breach first.
      - name: No dependency edge points up, dev edges included
        run: |
          python3 scripts/ci/check_no_upward_edge.py --selftest
          python3 scripts/ci/check_no_upward_edge.py
      # The signer's integers, `prism-int`. Its committed vectors are what
      # the script writes from Python's integers; the Rust tests read the
      # file. Its public surface is the committed list, and no trait that
      # would let a secret out is implemented for the secret types. Every
      # call of one of the three exits of the secret types, outside the
      # crate, has a row in the secret-treatment table of
      # docs/SIGNER_SPEC.md 2.1.3; the self-tests plant each breach. A few
      # seconds in all.
      - name: The integer crate's vectors, surface and secret exits are what is committed
        run: |
          set -euo pipefail
          python3 scripts/int_vectors.py --check
          python3 scripts/ci/check_int_surface.py --selftest
          python3 scripts/ci/check_int_surface.py
          python3 scripts/ci/check_secret_exits.py --selftest
          python3 scripts/ci/check_secret_exits.py
      - name: Check the G7 timing decision table and run validation
        run: python3 -B scripts/ci/test_g7_verdict.py
      - name: Validate the committed Stage 2c timing contrasts
        run: |
          for arch in x86_64 aarch64; do
            python3 -B -S scripts/ci/stage2c_timing.py "docs/benchmarks/stage2c/$arch.csv.gz" --repeats 512
          done
      - name: Check the Stage 2c basis reduction against its mathematical fixtures
        run: |
          python3 -B -S scripts/stage2c_oracle.py
          python3 -B -S scripts/stage2c_fixtures.py
          python3 -B -S scripts/stage2d_fixtures.py
      # A node that only verifies builds no signer code: the front crate's
      # `signer` feature is off by default, its default build graph holds
      # none of the integer crate, `zeroize` or `prism-ct-barrier`, and the graph
      # with the feature holds all three. And the integer crate's package
      # does not hold its 4.0 MB of vectors. The self-test plants each
      # breach. Two `cargo tree` and one `cargo package --list`: under a
      # second.
      - name: A default build is the verifier alone, and no package holds the vectors
        run: |
          set -euo pipefail
          python3 scripts/ci/check_consumer_build.py --selftest
          python3 scripts/ci/check_consumer_build.py
      # The script reads the parameter sets out of the field crate's source.
      # Nothing else runs it, so a change to how the sets are declared
      # would break it unseen.
      - name: The integer bounds of every parameter set hold
        run: python3 scripts/security_parameters.py
      # An independent script computes the challenge scalar: it reproduces
      # the s of every committed vector before its values for a set
      # without vectors count.
      - name: The challenge scalar agrees with an independent script
        run: python3 scripts/challenge_scalar.py --check
      # Known answers for arithmetic modulo 2^e, from Python's integers.
      # The Rust tests read the file; this holds the file to the script.
      - name: The residue known answers are what the script writes
        run: python3 scripts/residue_known_answers.py --check
      # The signer's constants (docs/SIGNER_SPEC.md section 1) are generated
      # by one standard-library script. `--selftest` runs its rules at toy
      # primes, where every branch a search can reach is reached. `--check`
      # regenerates every value at the five sets, requires the committed
      # files byte for byte, compares them with the committed values of the
      # C reference and of sqisign-rs, and tests each defining property.
      # About a minute. The aarch64 job runs `--check` too, so the bytes are
      # held on both architectures.
      - name: The signer constants are what the script generates, and equal their oracles
        run: |
          python3 scripts/signer_constants.py --selftest
          python3 scripts/signer_constants.py --check
      # Every file under prism-vectors/data has its SHA-256 in
      # prism-vectors/data.sha256, so a data file cannot change, appear or
      # disappear without that list changing in the same commit. `--moved`
      # holds the record of 2026-11-16: the move into the crate changed no
      # byte and no file name.
      - name: The committed test data is what its manifest records
        run: |
          python3 scripts/ci/check_vectors_manifest.py --selftest
          python3 scripts/ci/check_vectors_manifest.py
          python3 scripts/ci/check_vectors_manifest.py --moved
      # CI has no Sage and cannot run the script. This holds that the header
      # of each committed Sage file records the digest of the committed
      # script and the pinned image, so the script cannot change without a
      # new run. The Rust tests then read the files.
      - name: The Sage files record the committed script and the pinned image
        run: |
          python3 scripts/ci/check_sage_fixture.py --selftest
          python3 scripts/ci/check_sage_fixture.py
      # The isogeny crate's `oracle` feature (the affine pairing kept as a
      # reference, and the 2-isogeny model) is for the fuzz crate alone: no
      # other tracked manifest names it, the front crate's included, and
      # neither the verifier's build nor the front crate's has it. The
      # self-test plants each breach in a copy of the manifests first, so a
      # check that had gone blind fails here instead of passing.
      - name: The isogeny crate's reference code is in no build but the fuzz crate's
        run: |
          python3 scripts/ci/check_oracle_isolation.py --selftest
          python3 scripts/ci/check_oracle_isolation.py
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Every library crate denies missing documentation: the front crate
      # (the interface), the vectors crate (public data), the testkit (a
      # library of test inputs), the challenge-degree test, and the layer
      # crates. Here a broken link or any other rustdoc warning fails too.
      # One step for each feature set that makes something public; a step
      # builds every crate that has the feature. Their doc tests run in
      # the test jobs, which `cargo test --workspace` already includes.
      - name: Documentation of the library crates, default features
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p shekyl-prism -p prism-vectors -p prism-testkit -p prism-int -p prism-field -p prism-prime -p prism-ideal -p prism-isogeny -p prism-verify --no-deps --locked
      # The counter's module and the verifier's stage names are public only
      # with this feature, which the verifier's turns on in the field crate.
      - name: Documentation of the library crates, operation counter
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p prism-field -p prism-verify --features prism-verify/op-count --no-deps --locked
      # The affine pairing kept as a reference and the 2-isogeny model are
      # public only with this feature.
      - name: Documentation of the library crates, oracle
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p prism-isogeny --features oracle --no-deps --locked
      # The reduced-width experiment, which is not PRISM, is public only
      # with this feature.
      - name: Documentation of the library crates, reduced-width research
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p prism-verify --features research-reduced-width --no-deps --locked
      # `hazmat::int` and `hazmat::ideal` are public only with this feature.
      - name: Documentation of the front crate, signer
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc -p shekyl-prism --features signer --no-deps --locked
      # The counter is compiled only when asked for, so its code and the
      # reporter (an example of the testkit that requires the feature) are
      # linted in a pass of their own.
      - name: Clippy, operation counter
        run: cargo clippy -p prism-field -p prism-verify -p prism-testkit -p shekyl-prism --features prism-verify/op-count --all-targets --locked -- -D warnings
      # The workspace run leaves the research feature off, so the real-backend
      # adapter and the experiment drivers need their own pass.
      # The workspace run leaves the front crate's `signer` feature off, so
      # what it gates, and the test that requires it, need their own pass.
      - name: Clippy, the front crate with the signer feature
        run: cargo clippy -p shekyl-prism --features signer --all-targets --locked -- -D warnings
      - name: Clippy, comparison drivers
        run: cargo clippy -p prism-compare --features experiments --all-targets --locked -- -D warnings

  test-x86_64:
    name: test-x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - name: The runner is x86_64
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
      - name: Debug, overflow checks on
        run: cargo test --workspace --locked
      - name: Release
        run: cargo test --workspace --locked --release
      - name: Check all five native reducers and record paired wall-clock samples
        run: |
          set -euo pipefail
          cargo run --release --locked -p prism-ideal --example stage2c -- bench | tee stage2c-native.log
          python3 -B -S scripts/stage2c_fixtures.py --native-log stage2c-native.log
          python3 -B -S scripts/stage2d_fixtures.py --native-log stage2c-native.log
      - name: Install compiled-code inspection tools
        run: bash scripts/ci/apt_install.sh qemu-user valgrind
      - name: Inspect release instructions and compare secret-shift traces
        run: python3 scripts/ci/check_ct_shift.py --assembly stage2c-x86_64.asm
      - name: Measure reducer stack and inspect the full release path
        run: |
          set -euo pipefail
          bash scripts/ci/apt_install.sh gdb valgrind
          mkdir -p reducer-inspection
          python3 -B scripts/ci/stage2c_stack.py reducer-inspection | tee reducer-inspection/stack.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reducer-inspection-x86_64
          path: reducer-inspection/
          if-no-files-found: error
      - name: Preserve the compiled shift consumer for instruction review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2c-shift-x86_64
          path: stage2c-x86_64.asm
          if-no-files-found: error

      # Minutes in a debug build, so it is ignored by default and run here
      # in release by its full name. The log must show it ran: a renamed
      # test would otherwise match nothing and pass.
      - name: The pairing equals its affine reference on 1,000 pairs a level
        run: |
          set -euo pipefail
          cargo test -p prism-isogeny --release --locked -- --ignored --exact \
            pairing::tests::differential::a_thousand_random_pairs_per_set_agree > pairs.log 2>&1 || { cat pairs.log; exit 1; }
          grep -q 'test result: ok. 1 passed' pairs.log
      - name: The research module's tests
        run: "cargo test -p prism-verify --features research-reduced-width --locked --lib research::tests::"
      # The second configuration of the front crate: `signer` on, which the
      # workspace run above leaves off. Its lib unit tests and signer_layers
      # run, not the verifier's tests a second time. Without the feature
      # that file is skipped, so the log must show each reachability test
      # ran. The ideal layer's own tests are the crate `prism-ideal`: the
      # workspace run builds them too, and this step requires by name that
      # each one ran.
      - name: The front crate with the signer feature, debug and release
        run: |
          set -euo pipefail
          for profile in "" "--release"; do
            cargo test -p shekyl-prism --features signer --locked $profile --lib --test signer_layers > signer.log 2>&1 || { cat signer.log; exit 1; }
            grep -q 'test the_integers_are_under_hazmat ... ok' signer.log || { cat signer.log; exit 1; }
            grep -q 'test the_ideal_layer_is_under_hazmat ... ok' signer.log || { cat signer.log; exit 1; }
            cargo test -p prism-ideal --locked $profile --lib --test ideal_lattice --example stage2c > signer.log 2>&1 || { cat signer.log; exit 1; }
            grep -Fxq 'test geometry::tests::left_action_on_order_basis_and_fractional_inputs ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test guarded_intersections_match_the_coprime_lattice_sum ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test replay::replays_all_five_sets ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test reduce::half_tie::both_half_ties_at_every_set ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test driver::intersection_oracle::intersection_spans_match_oracle_hnfs_at_all_five_sets ... ok' signer.log || { cat signer.log; exit 1; }
          done

  test-aarch64:
    name: test-aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - name: The runner is aarch64
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
      # The same bytes on this architecture as on x86_64 (the lint job).
      - name: The signer constants are what the script generates, on aarch64
        run: python3 scripts/signer_constants.py --check
      - name: Debug, the portable fp2 path
        run: cargo test --workspace --locked
      - name: Release
        run: cargo test --workspace --locked --release
      - name: Check all five native reducers and record paired wall-clock samples
        run: |
          set -euo pipefail
          cargo run --release --locked -p prism-ideal --example stage2c -- bench | tee stage2c-native.log
          python3 -B -S scripts/stage2c_fixtures.py --native-log stage2c-native.log
          python3 -B -S scripts/stage2d_fixtures.py --native-log stage2c-native.log
      - name: Install compiled-code inspection tools
        run: bash scripts/ci/apt_install.sh qemu-user
      - name: Inspect release instructions and compare secret-shift traces
        run: python3 scripts/ci/check_ct_shift.py --assembly stage2c-aarch64.asm
      - name: Measure reducer stack and inspect the full release path
        run: |
          set -euo pipefail
          bash scripts/ci/apt_install.sh gdb valgrind
          mkdir -p reducer-inspection
          python3 -B scripts/ci/stage2c_stack.py reducer-inspection | tee reducer-inspection/stack.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reducer-inspection-aarch64
          path: reducer-inspection/
          if-no-files-found: error
      - name: Preserve the compiled shift consumer for instruction review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2c-shift-aarch64
          path: stage2c-aarch64.asm
          if-no-files-found: error

      # Minutes in a debug build, so it is ignored by default and run here
      # in release by its full name. The log must show it ran: a renamed
      # test would otherwise match nothing and pass.
      - name: The pairing equals its affine reference on 1,000 pairs a level
        run: |
          set -euo pipefail
          cargo test -p prism-isogeny --release --locked -- --ignored --exact \
            pairing::tests::differential::a_thousand_random_pairs_per_set_agree > pairs.log 2>&1 || { cat pairs.log; exit 1; }
          grep -q 'test result: ok. 1 passed' pairs.log
      - name: The research module's tests
        run: "cargo test -p prism-verify --features research-reduced-width --locked --lib research::tests::"
      # The second configuration of the front crate: `signer` on, which the
      # workspace run above leaves off. Its lib unit tests and signer_layers
      # run, not the verifier's tests a second time. Without the feature
      # that file is skipped, so the log must show each reachability test
      # ran. The ideal layer's own tests are the crate `prism-ideal`: the
      # workspace run builds them too, and this step requires by name that
      # each one ran.
      - name: The front crate with the signer feature, debug and release
        run: |
          set -euo pipefail
          for profile in "" "--release"; do
            cargo test -p shekyl-prism --features signer --locked $profile --lib --test signer_layers > signer.log 2>&1 || { cat signer.log; exit 1; }
            grep -q 'test the_integers_are_under_hazmat ... ok' signer.log || { cat signer.log; exit 1; }
            grep -q 'test the_ideal_layer_is_under_hazmat ... ok' signer.log || { cat signer.log; exit 1; }
            cargo test -p prism-ideal --locked $profile --lib --test ideal_lattice --example stage2c > signer.log 2>&1 || { cat signer.log; exit 1; }
            grep -Fxq 'test geometry::tests::left_action_on_order_basis_and_fractional_inputs ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test guarded_intersections_match_the_coprime_lattice_sum ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test replay::replays_all_five_sets ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test reduce::half_tie::both_half_ties_at_every_set ... ok' signer.log || { cat signer.log; exit 1; }
            grep -Fxq 'test driver::intersection_oracle::intersection_spans_match_oracle_hnfs_at_all_five_sets ... ok' signer.log || { cat signer.log; exit 1; }
          done

  # The field operations of a verification are deterministic, so the two
  # committed records are an exact match on both architectures. A change in
  # cost or in any negative's verdict fails here until the records are
  # regenerated and committed with the change that caused it.
  op-counts:
    name: op-counts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            machine: x86_64
          - runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - name: The runner is ${{ matrix.machine }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.machine }}"
      # The one build that names the field crate's feature and not the
      # verifier's: it builds the field crate alone, where the verifier's
      # feature does not exist. Every build of the verifier passes
      # `prism-verify/op-count`.
      - name: The counter's own test
        run: cargo test -p prism-field --features prism-field/op-count --locked ops
      # The tagged entry of the front crate refuses on the identifiers and
      # the caller's list before it touches the bare bytes. The test
      # requires the counter, so a plain `cargo test` skips it and this
      # step is where it runs.
      - name: A refusal by the tag layer costs no field operation
        run: cargo test -p shekyl-prism --test tag_layer_counts --features prism-verify/op-count --locked
      - name: Counts and verdicts equal the committed records
        run: sh scripts/op_counts.sh --check
      - name: A second run gives the same records
        run: sh scripts/op_counts.sh --check

  bench-smoke:
    name: bench-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      # Timings are printed. A non-zero exit means a sample's outcome was
      # not the expected refusal, so the bench stopped timing that path.
      - name: Bench
        run: cargo run --release --locked -p prism-bench

  deny:
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - name: Install cargo-deny 0.20.2
        run: python3 scripts/ci/install_pinned_tool.py cargo-deny
      - name: Licences, advisories, sources, bans
        run: |
          set -euo pipefail
          cargo deny check
          ( cd fuzz && cargo deny check )

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Gates
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_copyright.py --selftest
          python3 scripts/ci/check_commit_trailers.py --selftest
          python3 scripts/ci/check_commit_trailers.py --base "$BASE" --head "$HEAD"
          python3 scripts/ci/check_workspace_lints.py --selftest
          python3 scripts/ci/check_action_pins.py --selftest
          python3 scripts/ci/aggregate.py --selftest
          python3 scripts/ci/c_vectors_scope.py --selftest
          python3 scripts/ci/install_pinned_tool.py --selftest
          python3 scripts/differential_prime.py --selftest
          python3 scripts/ci/check_accept_verdicts.py --selftest
          python3 scripts/ci/mutants_report.py --selftest
          python3 scripts/ci/mutants_scope.py --selftest
          python3 scripts/ci/mutants_report.py record --file docs/lab/MUTANTS.toml

  c-reference-pin:
    name: c-reference-pin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - name: Pin and recorded quirks
        run: python3 scripts/check_c_reference.py
      # The C reference's values of the signer's constants are committed as
      # extracted (prism-vectors/data/signer/oracle_c_reference.txt). This
      # job has the submodule: it extracts them again and requires the
      # committed file byte for byte, with the digests of the source files.
      - name: The committed C oracle values are what the pinned tree holds
        run: python3 scripts/signer_constants.py --extract-c
      # The integer widths of docs/SIGNER_SPEC.md 2.1.2 were measured in a
      # build of the pinned tree with two patches applied to a copy
      # (scripts/build_traced_reference.sh). Nothing builds that here; this
      # holds that both patches still apply to the pin, so the measurement
      # can be run again.
      - name: The measurement's patches apply to the pinned tree
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          cp -R external/PRISM_v2/src "$work/src"
          patch -d "$work/src" -p4 --forward --input="$PWD/scripts/c/cornacchia-positive.patch"
          patch -d "$work/src" -p4 --forward --input="$PWD/scripts/c/ibz-trace.patch"
          grep -q 'ibz_trace_record' "$work/src/quaternion/ref/generic/intbig.c"
          rm -rf "$work"

  c-vectors:
    name: c-vectors
    needs: changes
    if: needs.changes.outputs.c_vectors == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - name: Compiler
        run: bash scripts/ci/apt_install.sh build-essential cmake
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - name: Rebuild the vectors from the pin
        run: python3 scripts/export_c_basis_hints.py
      - name: Rebuild salted algebraic fixtures from documented public seeds
        run: |
          set -euo pipefail
          PRISM_REF_BUILD=/tmp/prism-v2-ref sh scripts/export_s5_vectors.sh regenerate salt-brief-2026-11-12
          git diff --exit-code -- docs/comparison/salted-vector-generation.json
      - name: The committed vectors match
        run: bash scripts/ci/diff_vectors_data.sh
      - name: C Q is the cleared difference
        run: python3 scripts/check_even_basis.py 100
      # The integer crate's committed vectors, given to the reference's
      # ibz_* functions in the build made above: every convention a replay
      # of the reference depends on (docs/SIGNER_SPEC.md 2.1.4). The Rust
      # tests read the same file. A second of compiling and running.
      - name: The reference's integers agree with the integer crate's vectors
        run: PRISM_REF_BUILD=/tmp/prism-v2-ref sh scripts/check_int_conventions.sh

  native-signer:
    name: native-signer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - name: Compiler
        run: bash scripts/ci/apt_install.sh build-essential cmake
      - name: Build pinned libraries and SHAKE signer backend
        run: |
          set -euo pipefail
          python3 scripts/check_c_reference.py
          cmake -S external/PRISM_v2 -B target/native -DCMAKE_BUILD_TYPE=Release -DPRISM_BUILD_TYPE=ref -DGMP_LIBRARY=MINI
          cmake --build target/native --parallel 4 --target prism_lvl1 prism_lvl3 prism_lvl5
          PRISM_REF_BUILD="$PWD/target/native" sh scripts/export_s5_vectors.sh backend
      - name: Deterministic signing, new messages and verification at every level
        env:
          PRISM_SIGNER_BACKEND_DIR: ${{ github.workspace }}/target/native
        run: cargo test -p prism-signer --release --locked --test native -- --ignored
      - name: Research signing is production signing at full width
        env:
          PRISM_SIGNER_BACKEND_DIR: ${{ github.workspace }}/target/native
        run: cargo test -p prism-compare --features experiments --release --locked --test native -- --ignored
      # E3 of docs/SALT_PROTOCOL.md at projection widths 16 and 20.
      - name: Collision replay succeeds unsalted and fails salted
        run: |
          set -euo pipefail
          cargo build --release --locked -p prism-compare --features experiments --bin replay
          python3 scripts/ci/check_replay_regression.py target/release/replay target/native

  accept-verdicts:
    name: accept-verdicts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      # This checks provenance. Both Rust test jobs execute the complete corpus.
      - name: Every accept vector has a recorded model verdict
        run: python3 scripts/ci/check_accept_verdicts.py

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.97.1
      - uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:rust

  ci-pass:
    name: ci-pass
    needs:
      - changes
      - lint
      - test-x86_64
      - test-aarch64
      - bench-smoke
      - op-counts
      - deny
      - hygiene
      - c-reference-pin
      - c-vectors
      - accept-verdicts
      - native-signer
      - codeql
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - name: Aggregate
        env:
          C_VECTORS_NEEDED: ${{ needs.changes.outputs.c_vectors }}
          JOBS: |
            changes=${{ needs.changes.result }}
            lint=${{ needs.lint.result }}
            test-x86_64=${{ needs['test-x86_64'].result }}
            test-aarch64=${{ needs['test-aarch64'].result }}
            bench-smoke=${{ needs['bench-smoke'].result }}
            op-counts=${{ needs['op-counts'].result }}
            deny=${{ needs.deny.result }}
            hygiene=${{ needs.hygiene.result }}
            c-reference-pin=${{ needs['c-reference-pin'].result }}
            c-vectors=${{ needs['c-vectors'].result }}
            accept-verdicts=${{ needs['accept-verdicts'].result }}
            native-signer=${{ needs['native-signer'].result }}
            codeql=${{ needs.codeql.result }}
        run: python3 scripts/ci/aggregate.py
