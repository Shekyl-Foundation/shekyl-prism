#
# Nightly gate. A red run opens or comments on the issue `nightly RED`
# (`report-red`), except a dispatched run, which reports only when asked.
# The person who dispatched it is reading it.
#
# `mutants`, `mutants-front` and `coverage` are report-only until the
# first `dev` → `main` cut: a surviving mutant, a mutant that timed out, or
# a coverage figure is written to the job summary and does not fail the
# run. A tool that fails to install still fails. So does a mutants shard
# whose tool did not test its mutants, and so does `mutants-summary` when
# a shard it received fails that same test. Those are a red nightly.
#
# `only` empty runs every job. `only` set to `mutants` or `mutants-front`
# runs that job and `mutants-summary`. `shard` selects one index of the
# named job. `dispatch` refuses any other combination. The shard counts
# live in `scripts/ci/mutants_report.py`.
#
# The schedule runs the default branch's copy of this file. The level III
# floor-device measurement is not this workflow, and it is not started by
# a pull request: a public fork must not execute on owned hardware.

name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Open or comment on the tracking issue if a job is red."
        type: boolean
        default: false
      only:
        description: "Empty runs every job. mutants or mutants-front runs that job and mutants-summary."
        type: string
        default: ""
      shard:
        description: "With only set, one shard index of that job. Empty runs every shard of it."
        type: string
        default: ""

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Names the run before any other job starts. A dispatch this file does
  # not have fails here, and the outputs are still a matrix the skipped
  # jobs can parse.
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mutants_shards: ${{ steps.plan.outputs.mutants_shards }}
      mutants_of: ${{ steps.plan.outputs.mutants_of }}
      mutants_run: ${{ steps.plan.outputs.mutants_run }}
      front_shards: ${{ steps.plan.outputs.front_shards }}
      front_of: ${{ steps.plan.outputs.front_of }}
      front_run: ${{ steps.plan.outputs.front_run }}
      other_jobs: ${{ steps.plan.outputs.other_jobs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - id: plan
        env:
          ONLY: ${{ inputs.only || '' }}
          SHARD: ${{ inputs.shard || '' }}
        run: python3 scripts/ci/mutants_report.py plan --only "$ONLY" --shard "$SHARD"
        continue-on-error: true
      - name: The dispatch names a run this workflow has
        if: steps.plan.outcome == 'failure'
        run: exit 1

  fuzz:
    name: fuzz (${{ matrix.target }})
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.other_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - verify_level_1
          - verify_level_3
          - verify_level_5
          - decode_public_key
          - decode_signature
          - field_square
          - weil_matches_affine
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.94.0
      - name: Nightly toolchain and clang
        run: |
          set -euo pipefail
          bash scripts/ci/apt_install.sh clang
          rustup toolchain install nightly --profile minimal --component rust-src
      - name: Install cargo-fuzz 0.13.2
        run: python3 scripts/ci/install_pinned_tool.py cargo-fuzz
      # An exact key hit does not save. The key names this run, and the
      # restore prefix is every earlier corpus for the target, so a night
      # that found new inputs keeps them.
      - id: corpus
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: fuzz/corpus
          key: fuzz-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ matrix.target }}-
      - name: Seed full verification paths
        run: python3 scripts/seed_fuzz_corpus.py
      - id: fuzz
        name: 10 minutes
        env:
          FUZZ_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # The pinned cargo-fuzz binary is musl and defaults --target to that triple, where ASan is refused.
          cargo +nightly fuzz run "$FUZZ_TARGET" --target x86_64-unknown-linux-gnu -- -max_total_time=600 2>&1 | tee fuzz.log
          python3 - << 'PY'
          import os
          import pathlib
          import re
          import sys

          text = pathlib.Path("fuzz.log").read_text(errors="replace")
          units = [
              int(match)
              for match in re.findall(r"stat::number_of_executed_units:\s*(\d+)", text)
          ]
          dones = [int(match) for match in re.findall(r"^#(\d+)\s+DONE\b", text, re.M)]
          count = units[-1] if units else (dones[-1] if dones else 0)
          corpus = pathlib.Path("fuzz/corpus") / os.environ["FUZZ_TARGET"]
          files = [path for path in corpus.rglob("*") if path.is_file()] if corpus.is_dir() else []
          line = f"fuzz {os.environ['FUZZ_TARGET']}: executions {count}, corpus files {len(files)}"
          print(line)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write(f"## {os.environ['FUZZ_TARGET']}\n\n{line}\n")
          if count < 1000 or not files:
              sys.exit("fuzz did not execute, or it left an empty corpus")
          PY
      - name: Save the corpus
        if: steps.fuzz.outcome == 'success' || steps.fuzz.outcome == 'failure'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: fuzz/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}

  differential-prime:
    name: differential-prime
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.other_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.94.0
      - name: sympy 1.14.0
        run: python3 -m pip install --break-system-packages 'sympy==1.14.0'
      - name: 10_000 degrees per level, zero disagreements
        run: python3 scripts/differential_prime.py
      # The script that generates the signer's constants finds each secret
      # norm with its own primality test. sympy must name the same prime.
      - name: sympy names the same secret norm at all five sets
        run: python3 scripts/ci/check_signer_primes.py
      # The doc comment of `nonvanishing` states when its search can fail,
      # for every `zeta`. This is the computation behind that statement.
      - name: The theta base-change search fails only where its comment says
        run: python3 scripts/theta_base_search.py

  big-endian:
    name: big-endian
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.other_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.94.0
      - name: Install cross 0.2.5
        run: python3 scripts/ci/install_pinned_tool.py cross
      - name: s390x under qemu
        run: cross test --target s390x-unknown-linux-gnu --workspace --locked

  c-vectors-full:
    name: c-vectors-full
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.other_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: true
      - name: Compiler
        run: bash scripts/ci/apt_install.sh build-essential cmake
      - name: Rebuild the vectors from the pin
        run: python3 scripts/export_c_basis_hints.py
      - name: The committed vectors match
        run: bash scripts/ci/diff_vectors_data.sh

  # `mutants` and `mutants-front` are one procedure,
  # `.github/workflows/mutants-shard.yml`. The shard count is `MUTANT_JOBS`
  # in `scripts/ci/mutants_report.py`: `plan` deals the indexes, and `of`
  # is that count passed through once, to `--shard` and to the report.
  # What each job mutates is named here. Missed mutants and timeouts are
  # report-only. A shard is red when the tool did not test its mutants.
  # The sizes and why the layer job multiplies the time limit are
  # `docs/PRISM_CI_DESIGN.md`.
  #
  # The front crate's `acceptance` test is first and walks the corpus, so
  # a mutant costs about as much caught as missed. The tests are not
  # renamed for that; the job is dealt into more shards. `tag_layer_counts`
  # needs the operation counter and does not run here.
  mutants:
    name: mutants (${{ matrix.shard }}/${{ needs.dispatch.outputs.mutants_of }})
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.mutants_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.dispatch.outputs.mutants_shards || '[0]') }}
    uses: ./.github/workflows/mutants-shard.yml
    with:
      job: mutants
      shard: ${{ matrix.shard }}
      of: ${{ needs.dispatch.outputs.mutants_of }}
      mutate: prism-verify prism-field
      test: prism-field prism-verify prism-testkit shekyl-prism
      timeout_multiplier: "12"

  mutants-front:
    name: mutants-front (${{ matrix.shard }}/${{ needs.dispatch.outputs.front_of }})
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.front_run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.dispatch.outputs.front_shards || '[0]') }}
    uses: ./.github/workflows/mutants-shard.yml
    with:
      job: mutants-front
      shard: ${{ matrix.shard }}
      of: ${{ needs.dispatch.outputs.front_of }}
      mutate: shekyl-prism
      test: shekyl-prism

  # Figures for the jobs this run dealt. A present shard `verdict` rejects
  # is named, left out, and fails this job. A shard that is absent is
  # named and does not, by itself. The merged lists are uploaded only for
  # a full nightly whose every shard was present and accepted, so a
  # one-shard dispatch does not replace `missed-mutants`.
  mutants-summary:
    name: mutants-summary
    needs: [dispatch, mutants, mutants-front]
    if: ${{ always() && needs.dispatch.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: shards
      - id: gather
        name: All shards
        env:
          RUN_MUTANTS: ${{ needs.dispatch.outputs.mutants_run }}
          RUN_FRONT: ${{ needs.dispatch.outputs.front_run }}
        run: |
          set -euo pipefail
          args=(python3 scripts/ci/mutants_report.py gather --dir shards --write lists --explained docs/lab/MUTANTS.toml)
          if [ "$RUN_MUTANTS" = true ]; then
            args+=(--expect mutants)
          fi
          if [ "$RUN_FRONT" = true ]; then
            args+=(--expect mutants-front)
          fi
          "${args[@]}"
          if compgen -G 'lists/*.txt' > /dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the merged lists
        if: steps.gather.outputs.publish == 'true' && needs.dispatch.outputs.other_jobs == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: missed-mutants
          path: lists
          retention-days: 90
          overwrite: true
          if-no-files-found: error

  # Every test of the workspace, instrumented. The front crate's corpus
  # walks verify each input through three entries (bytes, typed, tagged),
  # and instrumented they are most of this job: `acceptance` alone took 21
  # of 45 minutes on the build VM at `85f165a`. At 30 minutes the job was
  # cancelled inside that test (run 44208264477). A runner took 38
  # minutes with the limit raised (run 44228767682). The limit is over
  # twice the VM's time, because runners differ in speed by nearly as much.
  coverage:
    name: coverage
    needs: dispatch
    if: ${{ needs.dispatch.result == 'success' && needs.dispatch.outputs.other_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-11-08
        with:
          toolchain: 1.94.0
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov 0.9.1
        run: python3 scripts/ci/install_pinned_tool.py cargo-llvm-cov
      - name: Coverage summary
        run: |
          set +e
          cargo llvm-cov --workspace --locked --summary-only > coverage.txt
          code=$?
          set -e
          {
            echo "## cargo llvm-cov"
            echo "exit ${code} (report-only until dev → main)"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  report-red:
    name: report-red
    needs: [dispatch, fuzz, differential-prime, big-endian, c-vectors-full, mutants, mutants-front, mutants-summary, coverage]
    # `failure()` is false for a job its own time limit cancelled. A
    # cancelled job is red and is reported.
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && (github.event_name == 'schedule' || inputs.report) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: context.runId,
              per_page: 100,
            });
            const passing = new Set(['success', 'skipped', 'neutral']);
            const red = jobs.filter((job) => job.conclusion && !passing.has(job.conclusion) && job.name !== 'report-red');
            if (red.length === 0) {
              core.setFailed('report-red ran and found no red job: a job was renamed, or the run failed somewhere this job does not read.');
              return;
            }
            const title = 'nightly RED';
            const body = [
              `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'Jobs that did not pass:',
              ...red.map((job) => `- [${job.name}](${job.html_url}): ${job.conclusion}`),
            ].join('\n');
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = open.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
