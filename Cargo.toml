[workspace]
resolver = "2"
members = [
    "prism-field",
    "prism-isogeny",
    "prism-verify",
    "prism-bench",
    "prism-signer",
    "prism-compare",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
fp2 = { version = "=0.6.0", default-features = false }
sha3 = "=0.10.9"
prism-field = { version = "0.1.0", path = "prism-field" }
prism-isogeny = { version = "0.1.0", path = "prism-isogeny" }
prism-verify = { version = "0.1.0", path = "prism-verify" }
prism-signer = { version = "0.1.0", path = "prism-signer" }

# Library members inherit this. prism-bench cannot: Cargo rejects a member
# that both inherits and overrides, and its counter has no safe form.
# scripts/ci/check_workspace_lints.py is what keeps that the only exception.
[workspace.lints.rust]
unsafe_code = "forbid"

# Hundreds of full theta chains are impractical with unoptimized field
# loops, especially under s390x emulation. Keep the checked test semantics
# while making the complete positive and negative corpus feasible in CI.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
