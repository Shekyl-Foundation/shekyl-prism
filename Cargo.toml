[workspace]
resolver = "2"
members = [
    "prism-ct-barrier",
    "prism-int",
    "prism-ideal",
    "prism-field",
    "prism-isogeny",
    "prism-verify",
    "prism-bench",
    "prism-signer",
    "prism-compare",
    "prism-vectors",
    "prism-testkit",
    "shekyl-prism",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
prism-ct-barrier = { version = "0.1.0", path = "prism-ct-barrier" }
fp2 = { version = "=0.6.0", default-features = false }
sha3 = "=0.10.9"
prism-int = { version = "0.1.0", path = "prism-int" }
prism-ideal = { version = "0.1.0", path = "prism-ideal" }
prism-field = { version = "0.1.0", path = "prism-field" }
prism-isogeny = { version = "0.1.0", path = "prism-isogeny" }
prism-verify = { version = "0.1.0", path = "prism-verify" }
prism-signer = { version = "0.1.0", path = "prism-signer" }
prism-vectors = { version = "0.1.0", path = "prism-vectors" }
prism-testkit = { version = "0.1.0", path = "prism-testkit" }
shekyl-prism = { version = "0.1.0", path = "shekyl-prism" }

# The benchmark counter and the signing mask barrier have audited local overrides.
[workspace.lints.rust]
unsafe_code = "forbid"

# Hundreds of full theta chains are impractical with unoptimized field
# loops, especially under s390x emulation. Keep the checked test semantics
# while making the complete positive and negative corpus feasible in CI.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
