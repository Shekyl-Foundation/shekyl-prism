[package]
name = "prism-bench"
description = "Time decode, the challenge hash, and one Baillie–PSW test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
prism-field = { workspace = true }
prism-verify = { workspace = true }

[[bin]]
name = "prism-verify-bench"
path = "src/main.rs"

# Cargo will not let a member both inherit workspace lints and override one
# of them. The counter is `mrs` / `rdtsc`, so this crate states `deny` itself
# and allows that one function. Every other member inherits `forbid`.
[lints.rust]
unsafe_code = "deny"
