[package]
name = "prism-field"
description = "The five PRISM parameter sets (p248, p324, p376, p500, p664): base and extension fields, encodings and the sizes each set fixes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Counts field operations per thread, and makes the module `ops` public.
# Off by default. The only manifest that may name it is prism-verify's,
# whose own `op-count` turns it on: pass `--features prism-verify/op-count`
# on the command line. `scripts/ci/check_op_count_isolation.py` holds that.
op-count = []

[dependencies]
fp2 = { workspace = true }

[lints]
workspace = true
