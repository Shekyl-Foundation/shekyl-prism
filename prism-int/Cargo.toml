[package]
name = "prism-int"
description = "Fixed-width signed integers for the PRISM signer: a public type with variable-time arithmetic and a secret type with fixed-shape operations, a sticky overflow mark and three named exits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
# The committed vectors are 4.0 MB, and the test that reads them cannot be
# built without them, so neither is in the package. They are regenerated
# only when an operation or a width is added: each new copy is 4.0 MB more
# in the repository's history (`scripts/int_vectors.py` says the same).
# `scripts/ci/check_consumer_build.py` reads the package's list.
exclude = ["/tests/data/", "/tests/vectors.rs"]

[dependencies]
zeroize = "=1.8.2"
prism-ct-barrier.workspace = true

# The oracle of `tests/oracle.rs`: an arbitrary-precision integer the
# results are compared with, and the two crates it is built on, named for
# the traits its floor division and its greatest common divisor are in.
# None is in a library build.
[dev-dependencies]
num-bigint = "=0.4.6"
num-integer = "=0.1.47"
num-traits = "=0.2.19"

[lints]
workspace = true
