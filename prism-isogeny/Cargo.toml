[package]
name = "prism-isogeny"
description = "Montgomery curves, their 2^e-torsion and Weil pairing, and (2,2)-isogeny chains in theta coordinates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# The routines an optimized routine replaced, kept as its reference. The
# crate's own tests see them without this; the fuzz crate turns it on to
# compare the two. Nothing shipped enables it.
oracle = []

[dependencies]
prism-field = { workspace = true }

[dev-dependencies]
prism-vectors = { workspace = true }

[lints]
workspace = true
