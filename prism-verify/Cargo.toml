[package]
name = "prism-verify"
description = "Pure-Rust PRISM verifier: canonical decoding, the salted prime-degree challenge, pairing check and both theta chains"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
research-reduced-width = []
# Counts field operations by stage, and makes the module `stage` and the
# counter's module `prism_field::ops` public. Off by default and enabled by
# no manifest: pass `--features prism-verify/op-count` on the command line.
# `scripts/ci/check_op_count_isolation.py` holds that.
op-count = ["prism-field/op-count"]

[dependencies]
prism-field = { workspace = true }
# The challenge degree and its primality test. Re-exported as `prime`.
prism-prime = { workspace = true }
prism-isogeny = { workspace = true }
sha3 = { workspace = true }

[dev-dependencies]
prism-vectors = { workspace = true }

[lints]
workspace = true
