[package]
name = "cqp-xcheck"
version = "0.0.0"
edition = "2021"
license = "BSD-3-Clause"
publish = false
description = "Research cross-check: exp64 quotient rule in the rust-lagrange-ct prototype (not part of the workspace, not the production reducer)"

# Standalone: an empty workspace table keeps this crate out of the
# repository workspace, its build and its CI.
[workspace]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
libc = "0.2"

[features]
weak-barrier = []
empirical = []

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
debug = 1
