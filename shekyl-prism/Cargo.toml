[package]
name = "shekyl-prism"
description = "PRISM signatures in pure Rust: the typed interface (keys and signatures valid by construction), with the layer crates under hazmat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# One feature, `signer`, off by default. A default build is the verifier
# and nothing of the signer: a node that only verifies compiles no signer
# code and none of the signer's dependencies. With `signer`, the layers of
# the signer that exist are re-exported under `hazmat` (today the
# integers and ideal arithmetic, `hazmat::int` and `hazmat::ideal`), and signing will appear behind it when it is
# written. `scripts/ci/check_consumer_build.py` holds the feature table to
# exactly this, and the default build graph to holding no signer crate.
#
# The operation counter and the reduced-width research code are features
# of the layer crates, asked for on the command line and enabled by no
# manifest; scripts/ci holds this crate to that.
[features]
default = []
signer = ["dep:prism-int"]

[dependencies]
# Built with `signer` alone for the integer and ideal layers.
prism-int = { workspace = true, optional = true }
prism-field = { workspace = true }
prism-isogeny = { workspace = true }
prism-verify = { workspace = true }

[dev-dependencies]
prism-vectors = { workspace = true }
# The negatives and the responses built from public data, for the tests
# that run both entries on them (`tests/support/entries.rs`). The testkit
# does not depend on this crate.
prism-testkit = { workspace = true }

# Shows with the operation counter that the tag layer does no field
# arithmetic. It asks for the counter and does not turn it on: a plain
# `cargo test` skips it, and CI's op-counts job names it.
[[test]]
name = "tag_layer_counts"
required-features = ["prism-verify/op-count"]

# Shows that the signer's layers are reachable through `hazmat` when the
# feature is on. A plain `cargo test` skips it, and CI names the feature.
[[test]]
name = "signer_layers"
required-features = ["signer"]

[lints]
workspace = true

[[example]]
name = "stage2c_p500"
required-features = ["signer"]

[[example]]
name = "stage2c"
required-features = ["signer"]
